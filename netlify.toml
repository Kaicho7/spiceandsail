# 404 fallback: unknown routes serve the branded 404 page with real 404 status
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[functions]
  directory = "netlify/functions"

[dev]
  port = 8888
  command = "npm run build"

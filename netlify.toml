[build]
  publish = "dist"
  command = "npm install && npm run build"

[images]
  # Netlify Image CDN — used via /.netlify/images?url=...&fm=webp&q=85
  # Serve, resize and convert images at the edge with caching.
  cache = "public"
  config = false

# Security headers across all routes
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Canonical domain enforcement: 301 redirect all www, plain HTTP, and staging domains to https://spiceandsail.com
[[redirects]]
  from = "https://www.spiceandsail.com/*"
  to = "https://spiceandsail.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.spiceandsail.com/*"
  to = "https://spiceandsail.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://spiceandsail.com/*"
  to = "https://spiceandsail.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://spiceandsail.netlify.app/*"
  to = "https://spiceandsail.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://spiceandsail.netlify.app/*"
  to = "https://spiceandsail.com/:splat"
  status = 301
  force = true

[[redirects]]

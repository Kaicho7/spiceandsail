[build]
  publish = "dist"
  command = "npm install && npm run build"

[images]
  # Netlify Image CDN — used via /.netlify/images?url=...&fm=webp&q=85
  # Serve, resize and convert images at the edge with caching.
  cache = "public"
  config = false

# 404 fallback: unknown routes serve the branded 404 page with real 404 status
# force=false (default) ensures static files are served first
[[redirects]]
  from = "/pages/thank-you/*"
  to = "/thank-you/"
  status = 301

[[redirects]]
  from = "/transfers/zanzibar-airport-to-nungwi/*"
  to = "/transfers/airport-to-nungwi/"
  status = 301

[[redirects]]
  from = "/transfers/nungwi/*"
  to = "/transfers/airport-to-nungwi/"
  status = 301

[[redirects]]
  from = "/safaris/mikumi/*"
  to = "/safaris/mikumi-day-trip/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404


# Lock spiceandsail.com as the only canonical host.
# Any request to the netlify.app subdomain 301s to the custom domain.
# force = true so this wins over the static files (which would otherwise serve 200).
[[redirects]]
  from = "https://spiceandsail.netlify.app/*"
  to = "https://spiceandsail.com/:splat"
  status = 301
  force = true

[functions]
  directory = "netlify/functions"

[dev]
  port = 8888
  command = "npm run build"

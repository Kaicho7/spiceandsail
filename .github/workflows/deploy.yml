name: Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Capture pre-redesign URL and SEO inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'redesign/eco-swahili-mobile-2026-11'
        run: node scripts/audit-url-inventory.js
      - name: Commit rendered baseline inventory to the feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'redesign/eco-swahili-mobile-2026-11'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          file_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/audit/url-inventory-before.csv?ref=${GITHUB_HEAD_REF}" --jq .sha)
          encoded=$(base64 -w 0 audit/url-inventory-before.csv)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/audit/url-inventory-before.csv" \
            -f message='chore(audit): save rendered pre-redesign SEO inventory [skip ci]' \
            -f branch="${GITHUB_HEAD_REF}" \
            -f sha="${file_sha}" \
            -f content="${encoded}"
      - name: Upload pre-redesign URL and SEO inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'redesign/eco-swahili-mobile-2026-11'
        uses: actions/upload-artifact@v4
        with:
          name: url-inventory-before
          path: audit/url-inventory-before.csv
          if-no-files-found: error
          retention-days: 7
      - run: npm test

  # Netlify production deployment is manual. GitHub must not publish the site
  # on every master push; the site owner handles Netlify or dispatches this
  # workflow explicitly when they want a deploy.
  deploy-prod:
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npm run build
      - uses: netlify/actions/cli@3185065f4ab2f6df6f2ef41ee013626e1c02a426
        with:
          args: deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  lighthouse:
    needs: build-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Start preview server
        run: |
          npx http-server dist -p 8080 -s &
          sleep 5
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080
            http://localhost:8080/tours/
            http://localhost:8080/transfers/
            http://localhost:8080/hotels/
          configPath: ./lighthouserc.json
          uploadArtifacts: true

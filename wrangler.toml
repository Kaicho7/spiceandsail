# Cloudflare Pages configuration for spiceandsail.com
name = "spiceandsail"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-22"

# The Island Concierge stores leads in Cloudflare KV.
[[kv_namespaces]]
binding = "SNS_KV"
id = "37894e4c42804f3ea74756f22b020559"
#
# Without the binding the lead endpoint fails honestly (503) and the widget
# falls back to WhatsApp; chat and quotes still work.
